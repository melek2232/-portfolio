# Applied on top of nav2_bringup's default nav2_params.yaml (see robot_base/nav2_params.py).
# Small, slow robot (body about 0.27 x 0.15 m), X2 lidar (8 m), open-loop odometry.
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.3
    alpha5: 0.2
    laser_min_range: 0.12
    laser_max_range: 8.0
    max_particles: 1500
    update_min_d: 0.1
    update_min_a: 0.1

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      # Regulated Pure Pursuit instead of Jazzy's default MPPI: MPPI samples 2000 trajectories per
      # cycle (heavy for the Pi) and its sampling noise (vx_std 0.2) is wider than this robot's whole
      # speed range, so it crawled at ~0.05 m/s in simulation. RPP is deterministic and light.
      __replace__: true
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.4

velocity_smoother:
  ros__parameters:
    max_velocity: [0.15, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.16
      inflation_layer:
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.16
      inflation_layer:
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

# Jazzy's defaults use base_footprint; this robot's root frame is base_link (no base_footprint).
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
