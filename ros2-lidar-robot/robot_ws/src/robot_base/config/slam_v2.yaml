# slam_toolbox tuned for: X2 lidar (about 10 Hz, 8 m, noisy), open-loop odometry (drifts in rotation),
# small indoor rooms, Raspberry Pi 5.  Input: /scan_filtered.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss     # robust to outliers (reflective / glass surfaces)

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_filtered
    mode: mapping
    use_sim_time: false

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.5
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 7.5               # X2 gets noisy near its 8 m limit
    minimum_time_interval: 0.25
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # process a scan every 0.08 m / 0.08 rad: the scan matcher corrects the drifting odometry often
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 7.5
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 1.5

    do_loop_closing: true              # closes the loop when the robot comes back to a known place
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # wider search window: open-loop odometry can be off by several degrees between two scans
    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # trust the scan matcher more than the odometry (angle especially)
    distance_variance_penalty: 0.6
    angle_variance_penalty: 0.8
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
