ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0          # overridden by the launch argument 'port'
    frame_id: lidar_link
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1               # 1 = TYPE_TRIANGLE
    device_type: 0               # 0 = serial
    sample_rate: 9
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: false
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 16.0
    range_min: 0.28
    frequency: 10.0
    invalid_range_is_inf: false
