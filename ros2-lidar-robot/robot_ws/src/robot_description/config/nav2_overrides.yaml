# Applied on top of nav2_bringup's default nav2_params.yaml (see launch/nav.launch.py).
# Small, slow robot (body about 0.27 x 0.15 m).
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true          # the robot is spawned at the map origin
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    laser_min_range: 0.12
    laser_max_range: 10.0
    max_particles: 1500
    update_min_d: 0.1
    update_min_a: 0.1

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      # MPPI requires model_dt >= controller period (1 / 10 Hz). Same 3 s horizon as the default
      # (56 x 0.05 s), half the samples: lighter for the Raspberry Pi.
      model_dt: 0.1
      time_steps: 30
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 1.0
      max_speed_xy: 0.15
      min_speed_xy: 0.0
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_theta: 1.5
      decel_lim_x: -0.5
      decel_lim_theta: -1.5
      vx_max: 0.15
      vx_min: -0.05
      wz_max: 1.0
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.4

velocity_smoother:
  ros__parameters:
    max_velocity: [0.15, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.16
      inflation_layer:
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.16
      inflation_layer:
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

# Jazzy's defaults use base_footprint; this robot's root frame is base_link (no base_footprint).
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
